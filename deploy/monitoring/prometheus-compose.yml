global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/vulnstream-alerts.yml
scrape_configs:
  - job_name: vulnstream
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/vulnstream_metrics_token
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8080
        refresh_interval: 5s
