global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/vulnstream-alerts.yml
# Without this block every rule above is evaluated and then discarded: Prometheus
# has no default receiver. An alert that is never delivered is not an alert.
alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: vulnstream
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/vulnstream_metrics_token
    dns_sd_configs:
      - names: [app]
        type: A
        port: 8080
        refresh_interval: 5s
